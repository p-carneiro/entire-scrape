name: Claude — Draft Plan
on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]

jobs:
  draft-plan:
    if: |
      (github.event_name == 'issues' && github.event.action == 'assigned' && github.event.assignee.login == 'claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: |
            You are working on issue #${{ github.event.issue.number }} in the repository ${{ github.repository }}.
          
            Issue title: ${{ github.event.issue.title }}
          
            Issue body:
            ${{ github.event.issue.body }}
          
            Triggering comment (if any):
            ${{ github.event.comment.body }}
          
            Your task:
            1. Explore the repo to understand the relevant code (use Read and Grep tools, not shell).
            2. Draft a clear implementation plan in Markdown covering:
              - Files you intend to change and why
              - Approach, tradeoffs, alternatives considered
              - Any open questions for the requester
            3. Post the plan as a comment on issue #${{ github.event.issue.number }} using the GitHub API via `gh issue comment ${{ github.event.issue.number }} --body "..."`.
            4. Do NOT write any code yet. Wait for plan approval.
            5. After posting, add the label `plan-pending-review` to the issue using `gh issue edit ${{ github.event.issue.number }} --add-label "plan-pending-review"`.
